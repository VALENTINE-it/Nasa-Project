services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-med-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    environment:
      - GIN_MODE=release
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-med-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-med-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-med-network

networks:
  aura-med-network:
    driver: bridge

volumes:
  backend-data: