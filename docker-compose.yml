version: '3.8'

services:
  aura-med:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BACKEND_PORT=8080
      - DB_PATH=/data/aura_med.db
      - SESSION_COOKIE_NAME=aura_session
      - MAX_REQUESTS_PER_MIN=60
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
      - DEMO_PASSWORD_A2041=mission-2041
      - DEMO_PASSWORD_A2056=mission-2056
      - DEMO_PASSWORD_A2089=mission-2089
      - SINGLE_ORIGIN=true
    volumes:
      - aura-med-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aura-med-data: